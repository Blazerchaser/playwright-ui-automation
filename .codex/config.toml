[mcp_servers.chrome-devtools]
command = "cmd"
args = ["/c", "pnpm", "dlx", "chrome-devtools-mcp@1.10.1", "--headless", "--isolated", "--no-usage-statistics", "--no-performance-crux"]
env = { SystemRoot = "C:\\Windows", PROGRAMFILES = "C:\\Program Files", CHROME_DEVTOOLS_MCP_NO_UPDATE_CHECKS = "1" }
startup_timeout_sec = 60
